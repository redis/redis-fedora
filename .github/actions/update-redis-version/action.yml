name: "Update Redis version"
description: >
  Set Version in redis.spec to the release tag and commit it to the release
  version branch. The spec is the only place the version is recorded. The
  vendored crate tarballs are not committed. The build regenerates them from
  the release tarball with `make sources`.

inputs:
  release_tag:
    description: "Release tag to build, for example 8.12.0 or 8.12-rc3"
    required: true
  release_version_branch:
    description: "Release version branch to commit to"
    required: true

outputs:
  changed_files:
    description: "Files that were modified (empty if none)"
    value: ${{ steps.update-version.outputs.changed_files }}
  rpm_version:
    description: "The tag as an RPM version, for example 8.12~rc3"
    value: ${{ steps.update-version.outputs.rpm_version }}

runs:
  using: "composite"
  steps:
    - name: Update Version in redis.spec
      id: update-version
      shell: bash
      env:
        TAG: ${{ inputs.release_tag }}
      run: |
        # A pre-release is 8.12-rc3 upstream and 8.12~rc3 in RPM, so that it
        # sorts before 8.12.
        RPM_VERSION="${TAG/-/\~}"
        echo "rpm_version=$RPM_VERSION" >> "$GITHUB_OUTPUT"

        # The spec downloads this tarball. Fail here, not an hour into a build.
        url="https://download.redis.io/releases/redis-${TAG}.tar.gz"
        if ! curl -fsSIL -o /dev/null "$url"; then
          echo "::error::$url does not exist"
          exit 1
        fi

        sed -i -E "s|^(Version:[[:space:]]+).*|\1${RPM_VERSION}|" redis.spec
        sed -i -E "s|^(Release:[[:space:]]+).*|\11%{?dist}|" redis.spec

        if git diff --quiet redis.spec; then
          echo "redis.spec is already at $RPM_VERSION"
          echo "changed_files=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Keep the newest changelog entry in step with Version, otherwise
        # rpmlint reports incoherent-version-in-changelog.
        today="$(LC_ALL=C date -u '+%a %b %d %Y')"
        sed -i -E "/^%changelog/{n;s|^\* [A-Za-z]{3} [A-Za-z]{3} [0-9]{2} [0-9]{4} (.*) - [^ ]+$|* ${today} \1 - ${RPM_VERSION}-1|}" redis.spec

        grep -E '^(Version|Release):' redis.spec
        grep -A1 '^%changelog' redis.spec
        echo "changed_files=redis.spec" >> "$GITHUB_OUTPUT"

    - name: Create verified commit
      if: steps.update-version.outputs.changed_files != ''
      uses: iarekylew00t/verified-bot-commit@v1
      with:
        message: "Update Redis version to ${{ inputs.release_tag }}"
        files: ${{ steps.update-version.outputs.changed_files }}
        ref: ${{ inputs.release_version_branch }}

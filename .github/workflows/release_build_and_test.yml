name: Release Build and Test

# This workflow is part of the Redis OSS release automation process.
#
# It creates the release version branch, sets Version in redis.spec to the
# release tag, builds the SRPM, rebuilds it with mock in every chroot and
# smoke-tests the result. Nothing is published. The release_handle artifact
# carries this run's id so Release Publish can submit the same SRPM to Copr.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build, for example 8.12.0 or 8.12-rc3'
        required: true
      workflow_uuid:
        description: 'Optional UUID to identify this workflow run'
        required: false
      release_type:
        description: 'Type of release to upload (public, internal)'
        required: true

# UUID is used to help automation to identify workflow run in the list of workflow runs.
run-name: "Release Build and Test${{ github.event.inputs.workflow_uuid && format(': {0}', github.event.inputs.workflow_uuid) || '' }}"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      # to create the release branches and commit the version change
      contents: write
    outputs:
      BUILD_MATRIX: ${{ steps.parse.outputs.BUILD_MATRIX }}
      release_version_branch: ${{ steps.ensure-branch.outputs.release_version_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate inputs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ "$RELEASE_TYPE" != "public" ] && [ "$RELEASE_TYPE" != "internal" ]; then
            echo "::error::Invalid release_type: $RELEASE_TYPE"
            exit 1
          fi
          # There is no release tarball for unstable, so there is nothing to package.
          if [ "$RELEASE_TAG" = "unstable" ]; then
            echo "::error::unstable builds are not supported for the Fedora packages"
            exit 1
          fi

      # Read the build matrix from the dispatched ref. Ensure Release Branch
      # below switches the checkout to the version branch.
      - name: Parse env file
        id: parse
        uses: ./.github/actions/parse-env-file

      - name: Validate Redis Release Archive
        uses: redis-developer/redis-oss-release-automation/.github/actions/validate-redis-release-archive@main
        with:
          release_tag: ${{ inputs.release_tag }}

      - name: Ensure Release Branch
        id: ensure-branch
        uses: redis-developer/redis-oss-release-automation/.github/actions/ensure-release-branch@main
        with:
          release_tag: ${{ inputs.release_tag }}
          allow_modify: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Redis version
        uses: ./.github/actions/update-redis-version
        with:
          release_tag: ${{ inputs.release_tag }}
          release_version_branch: ${{ steps.ensure-branch.outputs.release_version_branch }}

  build-n-test:
    needs: prepare-release
    uses: ./.github/workflows/build-n-test.yml
    with:
      build_matrix: ${{ needs.prepare-release.outputs.BUILD_MATRIX }}
      checkout_ref: ${{ needs.prepare-release.outputs.release_version_branch }}

  create-release-handle:
    needs: build-n-test
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Handle
        shell: bash
        run: |
          cat <<RELEASE_HANDLE >result.json
          {
            "release_tag": "${{ github.event.inputs.release_tag }}",
            "run_id": ${{ github.run_id }},
            "workflow_uuid": "${{ github.event.inputs.workflow_uuid }}",
            "release_type": "${{ github.event.inputs.release_type }}"
          }
          RELEASE_HANDLE
          cat result.json

      - name: Upload release handle artifact
        uses: actions/upload-artifact@v6
        with:
          name: release_handle
          path: result.json
          retention-days: 90

  # Notify only about build failures
  # as publish workflow will notify about publish success or failure
  slack-failure-notification:
    needs: [prepare-release, build-n-test]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Send Failure Slack notification
        uses: ./.github/actions/slack-notification
        with:
          slack_func: slack_format_failure_message
          release_tag: ${{ github.event.inputs.release_tag }}
          env: ${{ inputs.release_type == 'public' && 'production' || 'staging' }}
          message: ":x: Fedora package build failed"
          SLACK_WEB_HOOK_URL: ${{ secrets.SLACK_WEB_HOOK_URL }}
